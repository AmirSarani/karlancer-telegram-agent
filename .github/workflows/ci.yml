name: ci
on:
  push:
    branches: [main, api-first-mcp-agent]
  pull_request:
    branches: [main]

jobs:
  install-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: syntax check
        run: |
          node --check src/index.js
          node --check src/worker/runner.js
          node --check src/mcp/http-entry.js
          node --check src/mcp/stdio-entry.js

  unit-contract-integration:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            docs/TEST_REPORT.md
            IMPLEMENTATION_REPORT.md

  mcp-stdio:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/mcp/stdio-protocol.test.js tests/mcp/tools-registry.test.js

  mcp-http:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/mcp/http-protocol.test.js

  security:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/security/*.test.js

  playwright-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run guard:playwright

  docker-build:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t karlancer-agent:ci .

  sqlite-tests:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/integration/*.test.js tests/unit/*.test.js

  e2e-mock:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:mock

  # Live smoke is optional: runs but must honest-skip without token (exit 0)
  e2e-live-optional:
    runs-on: ubuntu-latest
    needs: install-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: live smoke (honest skip without token)
        run: npm run test:live
        env:
          # Intentionally unset — must skip, not fail
          KARLANCER_ACCESS_TOKEN: ''
